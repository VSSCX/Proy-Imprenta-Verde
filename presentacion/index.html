<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imprenta MMG — Prototipo del flujo (mockup)</title>
<style>
  :root{--azul:#15639e;--azuld:#0b3b66;--verde:#1f8a5b;--bg:#0e2233;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,Arial,sans-serif;}
  html,body{height:100%;background:var(--bg);overflow:hidden;}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .slide{display:none;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;}
  .slide.active{display:flex;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .imgwrap{max-width:94vw;max-height:88vh;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);background:#fff;}
  .imgwrap img{display:block;max-width:94vw;max-height:88vh;}
  .caption{position:fixed;top:22px;left:0;right:0;text-align:center;color:#fff;font-size:20px;font-weight:600;letter-spacing:.3px;text-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;}
  /* nav */
  .nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.10);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:40px;padding:8px 16px;z-index:50;}
  .nav button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;transition:.15s;}
  .nav button:hover{background:#1f8a5b;}
  .counter{color:#fff;font-size:14px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums;}
  .home{position:fixed;top:18px;right:20px;z-index:50;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:8px 16px;font-size:13px;text-decoration:none;cursor:pointer;}
  .dots{position:fixed;top:18px;left:20px;z-index:50;display:flex;gap:6px;}
  .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28);cursor:pointer;}
  .dots i.on{background:#1f8a5b;width:24px;border-radius:6px;}
  /* flujo slide */
  .flujo{width:100%;height:100%;background:radial-gradient(1200px 700px at 50% 0%,#16334d,#0e2233);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;}
  .flujo h2{font-size:40px;font-weight:800;margin-bottom:6px;text-align:center;}
  .flujo p.sub{color:#9fb6c9;font-size:19px;margin-bottom:36px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 26px;max-width:1500px;width:100%;}
  .cell{position:relative;background:linear-gradient(160deg,#1b3e5c,#15334c);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:24px 22px;text-decoration:none;color:#fff;transition:.18s;display:flex;flex-direction:column;gap:10px;min-height:150px;cursor:pointer;}
  .cell:hover{transform:translateY(-5px);border-color:#2bd07a;box-shadow:0 18px 40px rgba(0,0,0,.45);background:linear-gradient(160deg,#1f8a5b,#14633f);}
  .cell .n{position:absolute;top:14px;right:16px;font-size:13px;font-weight:800;color:#7fd1a8;}
  .cell .ic{font-size:34px;}
  .cell .t{font-size:20px;font-weight:700;line-height:1.2;}
  .cell .d{font-size:14px;color:#bcd0e0;line-height:1.35;}
  .cell:hover .d,.cell:hover .n{color:#eafff3;}
  .flowhint{margin-top:30px;color:#7fd1a8;font-size:16px;}
  /* node helper buttons */
  .nodebtns{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:40;}
  .nodebtns a{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;border-radius:24px;padding:8px 18px;font-size:14px;}
  .nodebtns a:hover{background:#1f8a5b;}
</style>
</head>
<body>
<div class="dots" id="dots"></div>
<a class="home" onclick="go(2)">&#9776; Ver flujo</a>
<div class="caption" id="caption"></div>
<div class="stage" id="stage"></div>
<div class="nav">
  <button onclick="prev()">&#8249;</button>
  <span class="counter" id="counter"></span>
  <button onclick="next()">&#8250;</button>
</div>

<script>
const FLOW = [
  {n:'01', ic:'\u{1F916}', t:'El agente', d:'Vive en Gmail y WhatsApp Business', go:3},
  {n:'02', ic:'\u{1F4E5}', t:'Lee la bandeja', d:'Monitorea los correos en tiempo real', go:4},
  {n:'03', ic:'\u{1F4D6}', t:'Entiende el pedido', d:'Producto, cantidades y area', go:5},
  {n:'04', ic:'\u{1F4CA}', t:'Registra la OT', d:'Trazabilidad en Google Sheets', go:6},
  {n:'05', ic:'\u{1F4E4}', t:'Responde la cotizacion', d:'Correo automatico con PDF', go:7},
  {n:'06', ic:'\u{1F9FE}', t:'Cotizacion PDF', d:'Formato formal de Imprenta MMG', go:8},
  {n:'07', ic:'\u{1F504}', t:'Actualiza el estado', d:'Cambia el estado de la OT', go:9},
  {n:'08', ic:'\u{1F465}', t:'Notifica al equipo', d:'Aviso a secretarias y diseno', go:10},
];
const SLIDES = [
  {type:'img', src:'assets/01_portada.png'},
  {type:'img', src:'assets/02_explicativa.png'},
  {type:'flujo'},
  {type:'img', src:'assets/04_agente.png', cap:'Paso 1 · El agente vive en Gmail + WhatsApp', node:true},
  {type:'img', src:'assets/05_inbox.png', cap:'Paso 2 · Lee la bandeja de entrada', node:true},
  {type:'img', src:'assets/06_email_pedido.png', cap:'Paso 3 · Abre y entiende el pedido', node:true},
  {type:'img', src:'assets/02_sheets_trazabilidad.png', cap:'Paso 4 · Registra la OT en Google Sheets', node:true},
  {type:'img', src:'assets/09_email_respuesta.png', cap:'Paso 5 · Responde al cliente con la cotizacion', node:true},
  {type:'img', src:'assets/10_cotizacion.png', cap:'Paso 6 · La cotizacion en PDF', node:true},
  {type:'img', src:'assets/11_sheets_estado.png', cap:'Paso 7 · Actualiza el estado de la OT', node:true},
  {type:'img', src:'assets/12_email_secretarias.png', cap:'Paso 8 · Notifica a secretarias el ingreso', node:true},
  {type:'img', src:'assets/13_costos.png'},
];
let cur=0;
const stage=document.getElementById('stage');
const dots=document.getElementById('dots');
SLIDES.forEach((_,i)=>{const d=document.createElement('i');d.onclick=()=>go(i);dots.appendChild(d);});

function render(){
  stage.innerHTML='';
  const s=SLIDES[cur];
  const div=document.createElement('div');
  div.className='slide active';
  if(s.type==='flujo'){
    let cells=FLOW.map(f=>`<a class="cell" onclick="go(${f.go})"><span class="n">${f.n}</span><span class="ic">${f.ic}</span><span class="t">${f.t}</span><span class="d">${f.d}</span></a>`).join('');
    div.innerHTML=`<div class="flujo"><h2>El flujo completo, paso a paso</h2><p class="sub">Haz clic en cualquier paso para verlo en detalle</p><div class="grid">${cells}</div><div class="flowhint">&#9889; De correo entrante a cotizacion enviada y registrada &#8212; en menos de 1 minuto</div></div>`;
  } else {
    div.innerHTML=`<div class="imgwrap"><img src="${s.src}"></div>`;
    if(s.node){
      const nb=document.createElement('div');nb.className='nodebtns';
      nb.innerHTML=`<a onclick="go(2)">&#8592; Volver al flujo</a><a onclick="next()">Siguiente &#8594;</a>`;
      div.appendChild(nb);
    }
  }
  stage.appendChild(div);
  document.getElementById('caption').textContent=s.cap||'';
  document.getElementById('counter').textContent=(cur+1)+' / '+SLIDES.length;
  [...dots.children].forEach((d,i)=>d.className=i===cur?'on':'');
}
function go(i){cur=Math.max(0,Math.min(SLIDES.length-1,i));render();}
function next(){go(cur+1);}
function prev(){go(cur-1);}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')next();
  if(e.key==='ArrowLeft')prev();
});
render();
</script>
</body>
</html>
